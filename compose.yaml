services:
  postgres:
    image: postgres:16-alpine
    container_name: go-ecommerce-postgres

    env_file:
      - .env.docker

    ports:
      - '5434:5432'

    volumes:
      - go_ecommerce_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.3
    container_name: go-ecommerce-migrate

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./migrations:/migrations:ro

    command:
      - '-path=/migrations'
      - '-database'
      - '${DATABASE_URL}'
      - 'up'

  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: go-ecommerce-api:dev
    container_name: go-ecommerce-api

    env_file:
      - .env.docker

    ports:
      - '8080:8080'

    depends_on:
      migrate:
        condition: service_completed_successfully

    restart: unless-stopped

volumes:
  go_ecommerce_postgres_data:
